<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1320" />
    <meta name="description" content="Salla Browser - متصفح تطبيقات منظومة Salla" />
    <link rel="icon" href="/icons/icon-192.png" />
    <title>Salla Browser</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('salla-browser-theme');
          if (theme !== 'light') document.documentElement.classList.add('dark');
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f7fb' : '#0a1320');
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
